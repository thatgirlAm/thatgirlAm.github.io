<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Amaëlle DIOP] - Portfolio Coming Soon</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons (GitHub, LinkedIn) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* CSS is embedded directly in the HTML for simplicity, as this is a single, temporary page. */
        :root {
            --primary-color: #a05fa4; /* Purple */
            --gold-accent: #D4AF37;   /* Gold */
            --dark-color: #1a1a1a;    /* Near-black for text */
            --light-color: #ffffff;   /* White */
            --grey-text: #555;        /* Dark grey for paragraph text */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--light-color);
            color: var(--dark-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 1rem;
        }

        .container {
            max-width: 600px;
            padding: 3rem 2rem;
            background: var(--light-color);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.07);
        }

        .icon {
            font-size: 4rem;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            animation: pulse 2.5s infinite ease-in-out;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--gold-accent);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.1rem;
            color: var(--grey-text);
            line-height: 1.7;
            margin-bottom: 2rem;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .social-links a {
            color: var(--dark-color);
            font-size: 2rem;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .social-links a:hover {
            color: var(--primary-color);
            transform: translateY(-5px);
        }
        
        footer {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #aaa;
        }

        /* The pulsing animation for the icon */
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

    </style>
</head>
<body>

    <main class="container">
        <!-- The animated icon - 'fa-cogs' means gears -->
        <div class="icon">
            <i class="fas fa-cogs"></i>
        </div>

        <h1>[Amaëlle DIOP]</h1>
        <h2>Portfolio Launching Soon</h2>
        
        <p>
            I'm currently building my new portfolio from scratch. Please check back soon to see my latest projects. In the meantime, you can find me on these platforms:
        </p>

        <div class="social-links">
            <a href="https://github.com/thatgirlAm" target="_blank" title="GitHub">
                <i class="fab fa-github"></i>
            </a>
            <a href="https://www.linkedin.com/in/amaellediop/" target="_blank" title="LinkedIn">
                <i class="fab fa-linkedin"></i>
            </a>
        </div>
        
        <footer>
            &copy; September 2025 [Amaëlle DIOP]
        </footer>
    </main>

</body>
</html>
